name: Renovar respaldo antiguo antes de siete días
run-name: "Respaldo ${{ inputs.sample_group || 'scheduled' }}"
on:
  workflow_run:
    workflows: ['Capítulos nuevos cada 5 minutos']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
    inputs:
      sample_group:
        description: 'Muestra fija de identidad; nunca acepta URLs arbitrarias'
        type: choice
        options: [baseline, verified-year, observed-token, recovered-import, voe-proof]
        default: baseline
      proof:
        description: 'Renovar únicamente las dos muestras antes de ampliar'
        type: boolean
        default: true
permissions:
  contents: write
  actions: write
jobs:
  renew:
    concurrency:
      group: zzanime-hourly-provider-data
      cancel-in-progress: false
    if: github.repository == 'ZZCoreDev/ZZAnime' && github.event.repository.private == false && (inputs.proof == true || vars.ZZ_RENEW_ENABLED == 'true') && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: provider-data
          path: data
      - name: Dependencias fijadas y pruebas sin IA
        working-directory: code/automation/hourly
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m pip install cryptography==46.0.3
          python3 test_cloud.py
          python3 test_news_empty.py
          python3 test_voe_channel.py
          python3 test_voe_consumer.py
          python3 test_link_health.py
          python3 test_flv_mega_build.py
          python3 test_renew.py
          python3 test_chain_continuity.py
          python3 test_history_prefix.py
          python3 test_news_watchdog.py
          python3 test_import_recovered.py
          python3 test_archive_coverage.py
          node test_identities.cjs
          node test_flv_tokens.cjs
          node test_source_diagnostics.cjs
          node test_source_failure_cache.cjs
          node test_title_entities.cjs
          python3 test_help_chain.py
          node --no-warnings ../help-worker/test_help_worker.mjs
      - name: Renovar y publicar por el canal firmado existente
        working-directory: code/automation/hourly
        env:
          ZZ_DATA: ${{ github.workspace }}/data/state
          ZZ_COLLECTOR_URL: 'https://zzanime-new-episodes.zzcoredev.workers.dev/'
          ZZ_COLLECTOR_KEY: ${{ secrets.ZZ_COLLECTOR_KEY }}
          ZZ_HELP_URL: 'https://zzanime-ayuda.zzcoredev.workers.dev'
          ZZ_HELP_KEY: ${{ secrets.ZZ_HELP_KEY }}
          ZZ_SIGNING_KEY: ${{ secrets.ZZ_DATA_SIGNING_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.ZZ_CLOUDFLARE_TOKEN }}
          ZZ_RENEW_PROOF: ${{ inputs.proof }}
          ZZ_RENEW_SAMPLE_GROUP: ${{ inputs.sample_group }}
          ZZ_NEWS_WATCHDOG_ENABLED: 'true'
        run: |
          if [ "$ZZ_RENEW_PROOF" = "true" ]; then
            python3 renew.py --proof --sample-group "${ZZ_RENEW_SAMPLE_GROUP:-baseline}" --publish
          else
            python3 renew.py --publish
          fi
      - name: Conservar avances y fallos incluso si una fuente no responde
        if: always()
        working-directory: data
        run: |
          git config user.name 'ZZAnime automation'
          git config user.email 'automation@users.noreply.github.com'
          git add state
          if ! git diff --cached --quiet; then
            git commit -m 'Renovar observaciones del respaldo y conservar fallos'
            git push origin HEAD:provider-data
          fi
      - name: Registrar deuda de renovación en ESTADO.md
        if: always()
        working-directory: code
        env:
          ZZ_DATA: ${{ github.workspace }}/data/state
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$ZZ_DATA/renewal-status.json" ]; then
            python3 automation/hourly/renew.py --write-status github
          fi
      - name: Continuar el histórico pendiente sin esperar a otro arranque ni al PC
        if: ${{ !cancelled() && inputs.proof != true && vars.ZZ_RENEW_ENABLED == 'true' }}
        working-directory: code
        env:
          ZZ_DATA: ${{ github.workspace }}/data/state
          GH_TOKEN: ${{ github.token }}
          ZZ_RENEW_OUTCOME: ${{ job.status }}
        run: python3 automation/hourly/renew.py --continue-if-due

