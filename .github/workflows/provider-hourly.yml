name: Capítulos nuevos cada hora
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      proof:
        description: 'Prueba aislada con dos series, sin publicar'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: zzanime-hourly-provider-data
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'ZZCoreDev/ZZAnime' && github.event.repository.private == false && (inputs.proof == true || vars.ZZ_HOURLY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: provider-data
          path: data
      - name: Dependencias fijadas, sin caché ni artefactos de pago
        working-directory: code/automation/hourly
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m pip install cryptography==46.0.3
          python3 test_cloud.py
      - name: Prueba aislada con lector real de la app
        if: inputs.proof == true
        working-directory: code/automation/hourly
        env:
          ZZ_PROOF: 'true'
          ZZ_COLLECTOR_URL: 'https://zzanime-new-episodes.zzcoredev.workers.dev/'
          ZZ_COLLECTOR_KEY: ${{ secrets.ZZ_COLLECTOR_KEY }}
          ZZ_DATA: ${{ github.workspace }}/proof-state
        run: python3 run.py --collect
      - name: Recoger, comprobar, firmar y publicar sin APK
        if: inputs.proof != true && vars.ZZ_HOURLY_ENABLED == 'true'
        working-directory: code/automation/hourly
        env:
          ZZ_DATA: ${{ github.workspace }}/data/state
          ZZ_COLLECTOR_URL: 'https://zzanime-new-episodes.zzcoredev.workers.dev/'
          ZZ_COLLECTOR_KEY: ${{ secrets.ZZ_COLLECTOR_KEY }}
          ZZ_SIGNING_KEY: ${{ secrets.ZZ_DATA_SIGNING_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.ZZ_CLOUDFLARE_TOKEN }}
        run: python3 run.py --collect --publish
      - name: Guardar avances y reintentos sin repetir capítulos
        if: always() && inputs.proof != true && vars.ZZ_HOURLY_ENABLED == 'true'
        working-directory: data
        run: |
          git config user.name 'ZZAnime automation'
          git config user.email 'automation@users.noreply.github.com'
          git add state
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar observaciones y comprobaciones de capítulos'
            git push origin HEAD:provider-data
          fi
