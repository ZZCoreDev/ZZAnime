name: Vigía de salud (avisos por issue)
on:
  schedule:
    - cron: '41 * * * *'
  push:
    branches: [main]
    paths: ['automation/hourly/health_watch.py', '.github/workflows/health-watch.yml']
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: zzanime-health-watch
  cancel-in-progress: false
jobs:
  watch:
    if: github.repository == 'ZZCoreDev/ZZAnime'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
        with:
          path: code
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
        with:
          repository: ZZCoreDev/ZZAnime-datos
          ref: provider-data
          ssh-key: ${{ secrets.ZZ_DATA_DEPLOY_KEY }}
          path: data
          persist-credentials: false
      - name: Memoria del vigía (rama health-watch)
        working-directory: code
        run: |
          mkdir -p "$RUNNER_TEMP/memory"
          if git fetch -q --depth 1 origin health-watch; then git show FETCH_HEAD:state.json > "$RUNNER_TEMP/memory/state.json" || true; fi
      - name: Resultado del probador de reproducción (rama playback-probe del repositorio privado)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
        continue-on-error: true
        with:
          repository: ZZCoreDev/ZZAnime-datos
          ref: playback-probe
          ssh-key: ${{ secrets.ZZ_DATA_DEPLOY_KEY }}
          path: branch-playback-probe
          persist-credentials: false
      - name: Copiar playback-probe.json de la rama playback-probe
        run: |
          mkdir -p "$(dirname "$GITHUB_WORKSPACE/data/state/playback-probe.json")"
          if [ -f "$GITHUB_WORKSPACE/branch-playback-probe/playback-probe.json" ]; then cp "$GITHUB_WORKSPACE/branch-playback-probe/playback-probe.json" "$GITHUB_WORKSPACE/data/state/playback-probe.json"; fi
      - name: Pruebas sin red
        working-directory: code/automation/hourly
        run: python3 test_health_watch.py
      - name: Comprobar y abrir, actualizar o cerrar issues
        working-directory: code/automation/hourly
        env:
          GH_TOKEN: ${{ github.token }}
          # Cloud key of zzanime-respaldo: reads the daily-cap report to warn of new bans. Never printed.
          ZZ_CHANNEL_KEY: ${{ secrets.ZZ_CHANNEL_KEY }}
        run: python3 health_watch.py --data "$GITHUB_WORKSPACE/data/state" --memory "$RUNNER_TEMP/memory/state.json"
      - name: Guardar la memoria (un único commit, se reemplaza)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/memory/state.json" ] || exit 0
          cd "$RUNNER_TEMP/memory"
          git init -q && git checkout -q -b health-watch
          git config user.name 'ZZAnime automation' && git config user.email 'automation@users.noreply.github.com'
          git add state.json && git commit -q -m 'Memoria del vigía de salud'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push -q -f "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:health-watch
