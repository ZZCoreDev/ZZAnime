name: Copia semanal de Supabase
# 14/11/2026 (Robin, idea 39): copia de la base de datos (cuentas, bibliotecas, fichas, correcciones, ajustes, seguridad)
# cada semana, cifrada con la contraseña de Robin (AES-256, PBKDF2 600.000) y guardada en el repositorio PRIVADO
# ZZAnime-datos, rama copias-supabase (se conservan las 4 últimas). En el registro público de esta tarea solo salen
# tamaños y fechas: nunca datos, ni la dirección de la base, ni la contraseña (además GitHub oculta los secretos).
# Llaves: SUPABASE_DB_URL y ZZ_BACKUP_PASSWORD (las pone Robin con Poner-llave-copia-supabase.cmd).
# 16/11/2026 (mejora B): el lunes 16/11 GitHub no lanzó la vuelta de las 03:17. Ahora hay más vueltas el lunes y el
# martes (36 h en total); cada una mira la fecha de la última copia guardada y no copia si es de hace menos de 40 h
# (así no se repite dentro de la misma tanda, y una copia a mano del viernes no salta la del lunes). A mano copia siempre.
on:
  schedule:
    - cron: '17 3 * * 1'
    - cron: '47 8 * * 1'
    - cron: '17 14 * * 1'
    - cron: '47 19 * * 1'
    - cron: '17 6 * * 2'
    - cron: '47 15 * * 2'
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Comprobar el volcado cifrado sin guardar una copia'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ (github.ref != 'refs/heads/main' || inputs.verify_only == true) && 'supabase-backup-proof' || 'supabase-backup' }}
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository == 'ZZCoreDev/ZZAnime' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.actor == 'ZZCoreDev' && github.triggering_actor == 'ZZCoreDev'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERIFY_ONLY: ${{ github.ref != 'refs/heads/main' || inputs.verify_only == true }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
        if: env.VERIFY_ONLY != 'true'
        with:
          repository: ZZCoreDev/ZZAnime-datos
          ssh-key: ${{ secrets.ZZ_DATA_DEPLOY_KEY }}
          path: datos
          fetch-depth: 1
      - name: ¿Hace falta copia? (solo en las vueltas programadas)
        id: due
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$VERIFY_ONLY" = true ]; then echo 'Prueba de copia sin guardar el resultado.'; echo run=1 >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" != schedule ]; then echo 'Lanzada a mano: se copia siempre.'; echo run=1 >> "$GITHUB_OUTPUT"; exit 0; fi
          cd datos
          LAST=''
          if git fetch -q --depth 1 origin copias-supabase:refs/remotes/origin/copias-supabase 2>/dev/null; then
            LAST=$(git ls-tree --name-only origin/copias-supabase | grep -oE '^supabase-[0-9]{8}-[0-9]{4}\.dump\.enc$' | sort | tail -1 | sed -E 's/^supabase-([0-9]{8})-([0-9]{2})([0-9]{2}).*/\1 \2:\3/' || true)
          fi
          if [ -n "$LAST" ]; then
            AGE=$(( $(date -u +%s) - $(date -u -d "$LAST UTC" +%s) ))
            if [ "$AGE" -lt 144000 ]; then echo "Ya hay copia de $LAST UTC (menos de 40 h): esta vuelta no copia."; echo run=0 >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "Última copia: $LAST UTC; toca copiar."
          else echo 'No se encontró ninguna copia: toca copiar.'; fi
          echo run=1 >> "$GITHUB_OUTPUT"
      - name: Instalar pg_dump 17 (misma versión que Supabase)
        if: steps.due.outputs.run == '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Copiar, cifrar y comprobar
        if: steps.due.outputs.run == '1'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.ZZ_BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          [ -n "$DB_URL" ] && [ -n "$PASS" ] || { echo 'Faltan las llaves de la copia (Poner-llave-copia-supabase.cmd).'; exit 1; }
          [ ${#PASS} -ge 12 ] || { echo 'La contraseña de la copia es demasiado corta.'; exit 1; }
          # Los parámetros de la URI tienen prioridad sobre los valores de entorno de libpq.
          DB_URL=$(python3 - <<'PY'
          import os
          from urllib.parse import parse_qsl, urlencode, urlsplit

          tls = {'sslmode': 'verify-full', 'sslrootcert': 'system', 'gssencmode': 'disable'}
          try:
              uri = urlsplit(os.environ['DB_URL'])
              if uri.scheme not in ('postgres', 'postgresql') or not uri.hostname:
                  raise ValueError
              params = [(key, value) for key, value in parse_qsl(uri.query, keep_blank_values=True) if key not in tls]
              print(uri._replace(query=urlencode(params + list(tls.items()))).geturl())
          except ValueError:
              raise SystemExit('Formato no válido para la URI de la copia.') from None
          PY
          )
          BIN=/usr/lib/postgresql/17/bin; NAME="supabase-$(date -u +%Y%m%d-%H%M).dump"; WORK=$(mktemp -d)
          trap 'rm -rf -- "$WORK"' EXIT
          OUT=out
          if [ "$VERIFY_ONLY" = true ]; then OUT="$WORK/out"; fi
          mkdir -p "$OUT"
          # Esquemas propios y las cuentas (auth); si las cuentas no se pudieran leer, la copia sigue sin ellas y lo dice.
          if "$BIN/pg_dump" "$DB_URL" -Fc --no-owner -n public -n zz_editor -n zz_security -n auth -f "$WORK/$NAME" 2> "$WORK/err"; then SCOPE=completa
          elif "$BIN/pg_dump" "$DB_URL" -Fc --no-owner -n public -n zz_editor -n zz_security -f "$WORK/$NAME" 2> "$WORK/err"; then SCOPE=sin-cuentas; mv "$WORK/$NAME" "$WORK/${NAME%.dump}-parcial.dump"; NAME="${NAME%.dump}-parcial.dump"
          else echo 'pg_dump no pudo leer la base (revisa SUPABASE_DB_URL). Tipo de error (sin datos privados):'
            grep -oiE 'password authentication failed|Tenant or user not found|could not translate host name|Network is unreachable|Connection refused|timeout expired|server version mismatch|aborting because of server version mismatch|permission denied for [a-z]+ [a-z_]+|SSL [a-z ]+|invalid URI query parameter|missing "=" after|invalid integer value|too many connections|circuit breaker[a-z ]*' "$WORK/err" | sort -u | head -5 || true
            exit 1; fi
          "$BIN/pg_restore" --list "$WORK/$NAME" > "$WORK/list"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 -salt -in "$WORK/$NAME" -out "$OUT/$NAME.enc" -pass env:PASS
          # comprobar que se descifra con la misma contraseña y que es idéntica
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 -in "$OUT/$NAME.enc" -out "$WORK/check" -pass env:PASS
          cmp -s "$WORK/check" "$WORK/$NAME" || { echo 'La copia cifrada no coincide.'; exit 1; }
          echo "$SCOPE" > "$OUT/scope"
          echo "Copia $SCOPE con TLS verificado: $(stat -c %s "$OUT/$NAME.enc") bytes cifrados, $(grep -c 'TABLE DATA' "$WORK/list") tablas con datos."
      - name: Guardar en el repositorio privado (4 últimas)
        if: steps.due.outputs.run == '1' && env.VERIFY_ONLY != 'true'
        run: |
          set -euo pipefail
          cd datos
          git config user.name 'ZZAnime copia'; git config user.email 'noreply@users.noreply.github.com'
          mkdir -p ../keep
          if git fetch -q --depth 1 origin copias-supabase:refs/remotes/origin/copias-supabase 2>/dev/null; then
            ALL=$(git ls-tree --name-only origin/copias-supabase | grep -E '^supabase-[0-9]{8}-[0-9]{4}(-parcial)?\.dump\.enc$' | sort -r || true)
            for f in $( (echo "$ALL" | head -3; echo "$ALL" | grep -v -- -parcial | head -1) | sort -u); do git show "origin/copias-supabase:$f" > "../keep/$f"; done
          fi
          git checkout -q --orphan copias-supabase-nueva
          git rm -rq --cached . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp ../keep/*.enc . 2>/dev/null || true
          cp ../out/*.enc .
          printf '%s\n' 'Copias semanales de Supabase CIFRADAS (AES-256-CBC, PBKDF2 600000, SHA-256).' 'Descifrar: openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 -in ARCHIVO.enc -out copia.dump' 'Restaurar: pg_restore (ver RECUPERAR.md del pendrive).' "Última: $(ls -1 supabase-*.enc | sort | tail -1) ($(cat ../out/scope))" > LEEME.txt
          git add -A
          git commit -qm "Copia semanal de Supabase $(date -u +%Y-%m-%d)"
          git push -q --force origin HEAD:copias-supabase
          echo "Guardadas: $(ls -1 supabase-*.enc | wc -l) copias."
