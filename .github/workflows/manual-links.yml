name: Enlaces de tus fichas (comprobación diaria)
# Comprueba una vez al día los enlaces de las fichas del editor y avisa con un único issue si alguno lleva dos días caído.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: zzanime-manual-links
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'ZZCoreDev/ZZAnime'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
      - name: Memoria (rama manual-links del repositorio privado)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
        continue-on-error: true
        with:
          repository: ZZCoreDev/ZZAnime-datos
          ref: manual-links
          ssh-key: ${{ secrets.ZZ_DATA_DEPLOY_KEY }}
          path: branch-manual-links
          persist-credentials: false
      - name: Copiar state.json de la rama manual-links
        run: |
          mkdir -p "$(dirname "$RUNNER_TEMP/memory/state.json")"
          if [ -f "$GITHUB_WORKSPACE/branch-manual-links/state.json" ]; then cp "$GITHUB_WORKSPACE/branch-manual-links/state.json" "$RUNNER_TEMP/memory/state.json"; fi
      - name: Pruebas sin red
        working-directory: automation/manual-links
        run: python3 test_manual_links.py
      - name: Comprobar enlaces y actualizar el aviso
        working-directory: automation/manual-links
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 manual_links.py --memory "$RUNNER_TEMP/memory/state.json"
      - name: Llave del repositorio privado (solo para guardar)
        if: always()
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
        with:
          repository: ZZCoreDev/ZZAnime-datos
          ref: provider-data
          ssh-key: ${{ secrets.ZZ_DATA_DEPLOY_KEY }}
          path: data-key
          sparse-checkout: state/pc-import-status.json
          sparse-checkout-cone-mode: false
      - name: Guardar la memoria en el repositorio privado (un único commit, se reemplaza)
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/memory/state.json" ] || exit 0
          cd "$RUNNER_TEMP/memory"
          git init -q && git checkout -q -b manual-links
          git config user.name 'ZZAnime automation' && git config user.email 'automation@users.noreply.github.com'
          git add state.json && git commit -q -m 'Memoria de enlaces de fichas'
          ssh=$(git -C "$GITHUB_WORKSPACE/data-key" config --get core.sshCommand)
          git -c core.sshCommand="$ssh" push -q -f git@github.com:ZZCoreDev/ZZAnime-datos.git HEAD:manual-links
