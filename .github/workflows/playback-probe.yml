name: Probador de reproducción (diario)
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zzanime-playback-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'ZZCoreDev/ZZAnime' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
        with:
          repository: ZZCoreDev/ZZAnime-datos
          ref: provider-data
          ssh-key: ${{ secrets.ZZ_DATA_DEPLOY_KEY }}
          path: data
          persist-credentials: false
          sparse-checkout: /state/published-assets/
          sparse-checkout-cone-mode: false
      - name: Resultado anterior (rama playback-probe del repositorio privado)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
        continue-on-error: true
        with:
          repository: ZZCoreDev/ZZAnime-datos
          ref: playback-probe
          ssh-key: ${{ secrets.ZZ_DATA_DEPLOY_KEY }}
          path: branch-playback-probe
          persist-credentials: false
          sparse-checkout: /playback-probe.json
          sparse-checkout-cone-mode: false
      - name: Aislar los activos del canal y el resultado anterior
        env:
          PROBE_INPUT: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil

          workspace = Path(os.environ['PROBE_INPUT']).resolve()
          data, previous = workspace/'data', workspace/'branch-playback-probe'
          assets = data/'state'/'published-assets'
          target = Path(os.environ['RUNNER_TEMP'])/'probe'
          target.mkdir(exist_ok=True)
          if assets.resolve() != assets or any(p.is_symlink() for p in assets.rglob('*')):
              raise SystemExit('Unexpected symbolic link in channel assets')
          shutil.copytree(assets, target/'assets')
          report = previous/'playback-probe.json'
          if report.resolve() == report and report.is_file():
              shutil.copyfile(report, target/'previous.json')
          for checkout in (data, previous):
              if checkout.exists():
                  if checkout.resolve() != checkout:
                      raise SystemExit('Unexpected symbolic link at checkout')
                  shutil.rmtree(checkout)
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: code
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (node24)
        with:
          node-version: '22'
      - name: Chromium headless y pruebas locales
        working-directory: code/automation/playback-probe
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          node --test test_probe.mjs test_select_paths.mjs
      - name: Abrir como mucho 12 embeds como la app (pausas de 20 s)
        working-directory: code/automation/playback-probe
        env:
          PROBE_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node probe.mjs "$RUNNER_TEMP/probe/assets" "$RUNNER_TEMP/probe/previous.json" "$RUNNER_TEMP/probe/playback-probe.json"
      - name: Llave del repositorio privado (solo para guardar)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
        with:
          repository: ZZCoreDev/ZZAnime-datos
          ref: provider-data
          ssh-key: ${{ secrets.ZZ_DATA_DEPLOY_KEY }}
          path: data-key
          sparse-checkout: /state/pc-import-status.json
          sparse-checkout-cone-mode: false
      - name: Guardar el resultado en el repositorio privado (un único commit, se reemplaza)
        run: |
          [ -f "$RUNNER_TEMP/probe/playback-probe.json" ] || exit 0
          mkdir -p "$RUNNER_TEMP/out" && cp "$RUNNER_TEMP/probe/playback-probe.json" "$RUNNER_TEMP/out/" && cd "$RUNNER_TEMP/out"
          git init -q && git checkout -q -b playback-probe
          git config user.name 'ZZAnime automation' && git config user.email 'automation@users.noreply.github.com'
          git add playback-probe.json && git commit -q -m 'Resultado del probador de reproducción'
          ssh=$(git -C "$GITHUB_WORKSPACE/data-key" config --get core.sshCommand)
          git -c core.sshCommand="$ssh" push -q -f git@github.com:ZZCoreDev/ZZAnime-datos.git HEAD:playback-probe
