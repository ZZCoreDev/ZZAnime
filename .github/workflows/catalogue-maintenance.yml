name: Mantenimiento autónomo de evidencias del catálogo
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      proof:
        description: Dos identidades antes de activar el resto
        type: boolean
        default: true
permissions: {}
concurrency:
  group: zzanime-catalogue-evidence
  cancel-in-progress: false
jobs:
  refresh:
    permissions:
      contents: write
    if: github.repository == 'ZZCoreDev/ZZAnime' && github.ref == 'refs/heads/main' && github.event.repository.private == false && (inputs.proof == true || vars.ZZ_CATALOGUE_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
        with:
          ref: ${{ github.sha }}
          path: code
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
        with:
          ref: catalogue-data
          path: data
          persist-credentials: false
      - name: Pruebas deterministas
        working-directory: code/automation/catalogue
        run: python3 test_collect.py
      - name: Recogida acotada sin IA
        working-directory: code/automation/catalogue
        env:
          ZZ_CATALOGUE_STATE: ${{ github.workspace }}/data/${{ inputs.proof == true && 'proof' || 'state' }}
          ZZ_PROOF: ${{ inputs.proof }}
        run: |
          if [ "$ZZ_PROOF" = "true" ]; then python3 collect.py --proof; else python3 collect.py; fi
      - name: Conservar datos, fallos y siguiente reintento
        if: always()
        working-directory: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'ZZAnime automation'
          git config user.email 'automation@users.noreply.github.com'
          for folder in state proof; do
            if [ -d "$folder" ]; then git add "$folder"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Guardar evidencias y reintentos del catálogo sin IA'
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            ZZ_GIT_AUTH="AUTHORIZATION: basic $auth" git --config-env=http.https://github.com/.extraheader=ZZ_GIT_AUTH push origin HEAD:catalogue-data
          fi
