name: Ayuda entre dispositivos (Worker)
on:
  push:
    branches: [main]  # 11/11 auditoría M-06
    paths: ['automation/help-worker/**', 'automation/hourly/plays.py', 'automation/hourly/skip_marks.py', 'automation/hourly/signal_policy.py', 'automation/hourly/help_chain.py', '.github/workflows/help-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    concurrency:
      group: zzanime-help-worker
      cancel-in-progress: false
    if: github.repository == 'ZZCoreDev/ZZAnime' && github.ref == 'refs/heads/main'  # 11/11 auditoría M-06
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (node24)
        with:
          node-version: '22'
      - name: Pruebas del Worker sin red
        working-directory: automation/hourly
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --no-warnings ../help-worker/test_help_worker.mjs
          node --no-warnings ../help-worker/test_submit_security.mjs
          node --no-warnings ../help-worker/test_signal_security.mjs
          node --no-warnings ../help-worker/test_help_session.mjs
          node --no-warnings ../help-worker/test_voter_quorum.mjs
      - name: Consumidores de votos y marcas (S2) sin red
        working-directory: automation/hourly
        run: |
          python3 -m pip install cryptography==46.0.3
          python3 -m unittest test_signal_security test_plays test_skip_marks test_single_renewal
      - name: Desplegar en Cloudflare (plan gratuito, Durable Object SQLite)
        working-directory: automation/help-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ZZ_CLOUDFLARE_TOKEN }}
          ZZ_COLLECTOR_KEY: ${{ secrets.ZZ_COLLECTOR_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          W=../hourly/node_modules/wrangler/bin/wrangler.js
          derive() { python3 -c "import hmac,hashlib,os,sys;print(hmac.new(os.environ['ZZ_COLLECTOR_KEY'].encode(),('zzanime-ayuda/'+sys.argv[1]).encode(),hashlib.sha256).hexdigest())" "$1"; }
          node "$W" deploy
          derive help-key | node "$W" secret put HELP_KEY
          derive salt | node "$W" secret put SALT
      - name: Comprobar que responde y lee el canal firmado
        env:
          ZZ_COLLECTOR_KEY: ${{ secrets.ZZ_COLLECTOR_KEY }}
        run: |
          URL=https://ayuda.zzanime.uk
          KEY=$(python3 -c "import hmac,hashlib,os;print(hmac.new(os.environ['ZZ_COLLECTOR_KEY'].encode(),b'zzanime-ayuda/help-key',hashlib.sha256).hexdigest())")
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL/" && curl -fsS -H "Authorization: Bearer $KEY" "$URL/v1/accepted" | python3 -c "import json,sys;d=json.load(sys.stdin);assert d['schema']==1;print('\naccepted',len(d['episodes']))" && curl -fsS -H "Authorization: Bearer $KEY" "$URL/v1/stats" | python3 -c "import json,sys;d=json.load(sys.stdin);assert d['schema']==1 and 'quorum' in d;print('stats ok')"; then exit 0; fi
            sleep 15
          done
          exit 1
